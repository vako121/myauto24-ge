name: Daily MyAuto sync

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Import MyAuto listings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MYAUTO_IMPORT_USER_ID: ${{ secrets.MYAUTO_IMPORT_USER_ID }}
          MYAUTO_IMPORT_CONTACT_NAME: ${{ secrets.MYAUTO_IMPORT_CONTACT_NAME }}
          MYAUTO_IMPORT_CONTACT_PHONE: ${{ secrets.MYAUTO_IMPORT_CONTACT_PHONE }}
        run: npm run scrape:myauto -- --limit 500
